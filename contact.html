<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Osa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Contact</h1>
    <p>Get in touch with me through the form below</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="skills.html">Skills</a>
  <a href="diary.html">Diary</a>
  <a href="contact.html">Contact</a>
</nav>

<main>
    <section id="contact">
        <h2>Get In Touch</h2>

        <form id="contact-form">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" required></textarea>
            </div>

            <button type="submit" id="submit-btn">Send Message</button>
            <p id="form-status"></p>
        </form>
    </section>
</main>

<footer>
    <p>© 2026 Osa | Portfolio Website</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
(function() {
    const supabaseUrl = "https://smiltpqmvtuvsfyqxaht.supabase.co";
    const supabaseKey = "sb_publishable_Yrk2D8-Jy_JGIv6M_YmWtg_PBXvCmQ3";
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const form = document.getElementById("contact-form");
    const status = document.getElementById("form-status");
    const btn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const message = document.getElementById("message").value;

        btn.disabled = true;
        status.textContent = "Sending message...";

        try {
            const { error } = await supabaseClient
                .from("contacts")
                .insert([{ name, email, message }]);

            if (error) throw error;

            status.textContent = "Thank you, your message has been sent.";
            status.style.color = "#22c55e";
            form.reset();
        } catch (err) {
            status.textContent = "Error: " + err.message;
            status.style.color = "#ef4444";
        } finally {
            btn.disabled = false;
        }
    });
})();
</script>

</body>
</html>
