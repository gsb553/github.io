<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Portfolio</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-color: #ff6b6b;
        }

        body {
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }

        #contact {
            max-width: 600px;
            margin: 50px auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #contact h2 {
            text-align: center;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #764ba2;
            outline: none;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.2);
        }

        #submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: var(--primary-gradient);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        #submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #form-status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .back-home {
            display: inline-block;
            margin: 20px;
            text-decoration: none;
            color: #764ba2;
            font-weight: bold;
        }
    </style>
</head>
<body>

<a href="index.html" class="back-home">← Back to Home</a>

<section id="contact">
    <h2>Get In Touch</h2>

    <form id="contact-form">
        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="group">
            <label for="message">Message</label>
            <textarea id="message" rows="5" required></textarea>
        </div>

        <button type="submit" id="submit-btn">Send Message</button>
        <p id="form-status"></p>
    </form>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
(function() {
    // Database credentials
    const supabaseUrl = "https://smiltpqmvtuvsfyqxaht.supabase.co";
    const supabaseKey = "sb_publishable_Yrk2D8-Jy_JGIv6M_YmWtg_PBXvCmQ3";

    // Initialize client with a unique name to avoid conflicts
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const form = document.getElementById("contact-form");
    const status = document.getElementById("form-status");
    const btn = document.getElementById("submit-btn");

    if (form) {
        form.addEventListener("submit", async (event) => {
            // STOP THE PAGE REFRESH (The "?" in the URL)
            event.preventDefault();

            // Get form values
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const message = document.getElementById("message").value;

            // UI Feedback
            btn.disabled = true;
            status.textContent = "⌛ Sending message...";
            status.style.color = "#667eea";

            try {
                // Send to Supabase table named 'contacts'
                const { error } = await supabaseClient
                    .from("contacts")
                    .insert([{ name, email, message }]);

                if (error) throw error;

                // Success
                status.textContent = "✅ Message sent successfully!";
                status.style.color = "green";
                form.reset();

            } catch (err) {
                // Error handling
                status.textContent = "❌ Error: " + err.message;
                status.style.color = "red";
                console.error("Supabase Error:", err);
            } finally {
                btn.disabled = false;
            }
        });
    }
})();
</script>

</body>
</html>
