<style>

/* ===== Site Theme (CSS Variables) ===== */
:root{
--bg:#f4f7fb;
--text:#333;
--header:#1e3a8a;
--nav:#111827;
--accent:#60a5fa;
--card:#ffffff;
}

/* ===== Global Styles ===== */
body{
font-family: Arial, sans-serif;
margin:0;
background:var(--bg);
color:var(--text);
line-height:1.6;
}

/* ===== Header ===== */
header{
background:var(--header);
color:white;
padding:1.8rem;
text-align:center;
}

header h1{
margin:0;
font-size:2rem;
}

header p{
margin-top:0.5rem;
font-size:0.95rem;
}

/* ===== Navigation ===== */
nav{
background:var(--nav);
padding:0.9rem;
text-align:center;
}

nav a{
color:white;
margin:0 15px;
text-decoration:none;
font-weight:bold;
transition:0.3s;
}

nav a:hover{
color:var(--accent);
}

/* ===== Main Content ===== */
main{
max-width:900px;
margin:auto;
padding:2rem;
}

/* ===== Content Sections ===== */
section{
background:var(--card);
padding:1.5rem;
margin-bottom:1.5rem;
border-radius:10px;
box-shadow:0 3px 12px rgba(0,0,0,0.08);
}

h2{
color:var(--header);
margin-top:0;
}

/* ===== Footer ===== */
footer{
text-align:center;
padding:1rem;
background:var(--nav);
color:white;
margin-top:2rem;
font-size:0.9rem;
}

</style>
