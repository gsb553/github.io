<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h1 {
      color: #2563eb;
      text-align: center;
    }

    h2 {
      color: #333;
      margin-top: 30px;
    }

    p {
      line-height: 1.6;
      color: #555;
    }

    ul {
      list-style-type: square;
    }

    a.button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    a.button:hover {
      background-color: #1e40af;
    }

    img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Welcome to My Website</h1>

    <p>Hello! My name is Osa and this is my first website.</p>

    <h2>About Me</h2>
    <p>I am learning web development at the University of York.</p>

    <h2>My Interests</h2>
    <ul>
      <li>Web Development</li>
      <li>Computer Science</li>
      <li>Technology</li>
    </ul>

    <img src="https://via.placeholder.com/600x300" alt="Placeholder image">

    <p>
      <a class="button" href="https://www.example.com">Visit my favourite website</a>
    </p>
  </div>
</body>
</html>
