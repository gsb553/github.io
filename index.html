<html lang="en">

        :root {
            --primary-gradient: linear-gradient(135deg, #1e3a8a 0%, #764ba2 100%);
            --nav-bg: #111827;
            --card-bg: rgba(255, 255, 255, 0.9);
            --accent-blue: #60a5fa;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            background: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }

        header {
            background: var(--primary-gradient);
            color: white;
            padding: 5rem 1.5rem; /* Increased padding slightly for a grander feel */
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: -1px;
            color: #ffffff; /* Explicitly white */
            text-shadow: 0 4px 10px rgba(0,0,0,0.2); /* Makes the name pop */
        }

        header p {
            font-size: 1.25rem;
            opacity: 1; /* Changed from 0.9 to 1 for max brightness */
            color: #ffffff; /* Changed from grey to bright white */
            font-weight: 500;
            max-width: 700px;
            margin: 1rem auto 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3); /* Critical fix for readability */
        }

        nav {
            background: var(--nav-bg);
            padding: 1rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        nav a {
            color: white;
            margin: 0 20px;
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-blue);
            text-shadow: 0 0 8px var(--accent-blue);
        }

        main {
            max-width: 900px;
            margin: -50px auto 40px; /* Slight overlap with header */
            padding: 0 2rem;
        }

            padding: 3rem;

            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
            animation: slideUp 0.8s ease-out;
        }
