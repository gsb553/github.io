<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills | Osa</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-accent: #38bdf8;
            --secondary-accent: #fbbf24;
            --tertiary-accent: #f472b6;
            --text-white: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .back-home {
            position: fixed;
            top: 25px;
            left: 25px;
            text-decoration: none;
            color: var(--text-white);
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 1001;
        }

        .back-home:hover {
            background: var(--primary-accent);
            color: var(--bg-dark);
            transform: scale(1.05);
        }

        .skills-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 35px;
            background: linear-gradient(to right, var(--primary-accent), var(--tertiary-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .skill-section {
            margin-bottom: 30px;
        }

        h3 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary-accent);
            padding-left: 10px;
        }

        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .badge {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: transform 0.2s;
            cursor: default;
        }

        .badge:hover {
            transform: translateY(-3px);
        }

        .lang { background: rgba(56, 189, 248, 0.15); color: var(--primary-accent); border: 1px solid var(--primary-accent); }
        .tool { background: rgba(251, 191, 36, 0.15); color: var(--secondary-accent); border: 1px solid var(--secondary-accent); }
        .area { background: rgba(244, 114, 182, 0.15); color: var(--tertiary-accent); border: 1px solid var(--tertiary-accent); }
    </style>
</head>
<body>

    <a href="index.html" class="back-home">← Back to Home</a>

    <main class="skills-container">
    <h1>Skills & Learning</h1>

    <div class="skill-section">
        <h3>Programming Languages</h3>
        <div class="badge-container">
            <span class="badge lang">Python</span>
            <span class="badge lang">Java</span>
            <span class="badge lang">HTML</span>
            <span class="badge lang">CSS</span>
            <span class="badge lang">JavaScript</span>
        </div>
    </div>

    <div class="skill-section">
        <h3>Web Development</h3>
        <div class="badge-container">
            <span class="badge area">Responsive Design</span>
            <span class="badge area">Frontend Development</span>
            <span class="badge area">Basic Backend (Learning)</span>
        </div>
    </div>

    <div class="skill-section">
        <h3>Languages</h3>
        <div class="badge-container">
            <span class="badge tool">Fluent English</span>
            <span class="badge tool">Dutch (Beginner - Active Learner)</span>
        </div>
    </div>

    <div class="skill-section">
        <h3>Currently Learning</h3>
        <div class="badge-container">
            <span class="badge tool">Databases</span>
            <span class="badge tool">Supabase</span>
            <span class="badge tool">Advanced JavaScript</span>
        </div>
    </div>

</main>
